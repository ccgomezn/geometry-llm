[project]
name = "geomap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ccgomezn", email = "gfcristhian98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "matplotlib>=3.11.2",
    "nnsight>=0.8.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers==4.57.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
