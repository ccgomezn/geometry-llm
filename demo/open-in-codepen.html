<!doctype html><meta charset='utf-8'><title>Open in CodePen</title><body style='font:16px system-ui;margin:40px'><h1 style='font-size:20px'>Move the map → CodePen</h1><p>Click the button: CodePen opens a new pen with the demo filled in. Save it under your account, then paste the pen's URL on its own line in your Medium post.</p><form action='https://codepen.io/pen/define' method='POST' target='_blank'><input type='hidden' name='data' value="{&quot;title&quot;: &quot;Move the map: editing two numbers inside a language model&quot;, &quot;html&quot;: &quot;<main>\n  <h1>Move the map</h1>\n  <p class=\&quot;lede\&quot;>A language model reads a short description of where three things are. We never change the text. Instead we\n    edit <b>two numbers inside the model</b>, in the sentence that places one object, and ask it six questions.\n    Click a spot on the map to move that object there.</p>\n  <div class=\&quot;tabs\&quot; id=\&quot;tabs\&quot; role=\&quot;group\&quot; aria-label=\&quot;Scene\&quot;></div>\n  <div class=\&quot;layout\&quot;>\n    <figure>\n      <svg class=\&quot;map\&quot; id=\&quot;map\&quot; viewBox=\&quot;0 0 420 420\&quot; role=\&quot;img\&quot; aria-label=\&quot;Map of the scene\&quot;></svg>\n      <div class=\&quot;legend\&quot; id=\&quot;legend\&quot;></div>\n      <label class=\&quot;toggle\&quot;><input type=\&quot;checkbox\&quot; id=\&quot;rings\&quot;> Show where a probe reads each object from the activations (rough: it reads\n        positions well on average, R\u00b2 0.74, but the answers don't rely on that copy)</label>\n    </figure>\n    <div>\n      <div class=\&quot;panel\&quot;>\n        <h2>What the model reads (unchanged)</h2>\n        <p class=\&quot;desc\&quot; id=\&quot;desc\&quot;></p>\n        <p class=\&quot;edit-note\&quot; id=\&quot;editnote\&quot;></p>\n      </div>\n      <div class=\&quot;panel\&quot;>\n        <h2>How far to move it (inside the model)</h2>\n        <div class=\&quot;slider-row\&quot;><input type=\&quot;range\&quot; id=\&quot;alpha\&quot; min=\&quot;0\&quot; max=\&quot;4\&quot; step=\&quot;1\&quot; value=\&quot;4\&quot; aria-label=\&quot;How far to move the object\&quot;></div>\n        <div class=\&quot;ticks\&quot;><span>not at all</span><span>\u00bc</span><span>halfway</span><span>\u00be</span><span>all the way</span></div>\n        <p class=\&quot;callout\&quot; id=\&quot;callout\&quot; hidden></p>\n      </div>\n      <div class=\&quot;panel\&quot;>\n        <h2>The model's answers</h2>\n        <table>\n          <thead><tr><th>Question</th><th>Correct here</th><th>Model, after the edit</th></tr></thead>\n          <tbody id=\&quot;answers\&quot;></tbody>\n        </table>\n        <p class=\&quot;score\&quot; id=\&quot;score\&quot;></p>\n      </div>\n    </div>\n  </div>\n  <footer>\n    <p id=\&quot;stats\&quot;></p>\n    <p>Gemma 3 12B. Edit: a 2-D subspace learned by distributed alignment search, layer 14, over the moved object's sentence.\n      Probe rings: positions read from the activations at the object-list mentions by a linear probe (layer 21), pinned to the first object.\n      Demo scenes are ones the model answers correctly before any edit.</p>\n  </footer>\n</main>&quot;, &quot;css&quot;: &quot;@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');\n\n:root {\n  color-scheme: light;\n  --surface: #fcfcfb; --panel: #f4f3f0; --line: #e4e2dc; --grid: #ecebe6;\n  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;\n  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;\n  --ok: #1d7a3e; --bad: #b3261e; --accent: #2a78d6;\n}\n@media (prefers-color-scheme: dark) {\n  :root:where(:not([data-theme=\&quot;light\&quot;])) {\n    color-scheme: dark;\n    --surface: #1a1a19; --panel: #232321; --line: #34332f; --grid: #2a2a27;\n    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;\n    --s1: #3987e5; --s2: #d95926; --s3: #199e70;\n    --ok: #5cc27f; --bad: #f08a80; --accent: #3987e5;\n  }\n}\n:root[data-theme=\&quot;dark\&quot;] {\n  color-scheme: dark;\n  --surface: #1a1a19; --panel: #232321; --line: #34332f; --grid: #2a2a27;\n  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;\n  --s1: #3987e5; --s2: #d95926; --s3: #199e70;\n  --ok: #5cc27f; --bad: #f08a80; --accent: #3987e5;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: var(--surface); color: var(--text); }\nbody { font: 15px/1.5 Inter, system-ui, sans-serif; }\nmain { max-width: 980px; margin: 0 auto; padding: 20px 16px 28px; }\nh1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }\n.lede { color: var(--text-2); margin: 0 0 14px; max-width: 70ch; }\n.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }\n.tabs button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);\n  background: transparent; color: var(--text-2); cursor: pointer; }\n.tabs button[aria-pressed=\&quot;true\&quot;] { background: var(--text); color: var(--surface); border-color: var(--text); }\n.layout { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; align-items: start; }\nfigure { margin: 0; max-width: 420px; }\n@media (max-width: 600px) { .layout { grid-template-columns: minmax(0, 1fr); } figure { margin: 0 auto; width: 100%; } }\nsvg.map { width: 100%; height: auto; display: block; background: var(--panel); border-radius: 10px; touch-action: manipulation; }\n.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); margin-top: 8px; }\n.legend span { display: inline-flex; align-items: center; gap: 6px; }\n.panel { background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }\n.panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; }\n.desc { margin: 0; }\n.desc mark { background: none; color: inherit; border-b quot;all the way\&quot;];\nconst state = { scene: 0, target: 0, alpha: 4, rings: false };\n// open each scene on a spot where the edit changes the correct answers and the model follows\nfunction bestTarget(sc) {\n  let best = 0, score = -1;\n  sc.targets.forEach((t, i) => {\n    const a = t.steps[0], z = t.steps[4];\n    const v = z.truth.reduce((n, tr, q) => n + (z.clear[q] &amp;&amp; tr !== a.truth[q] &amp;&amp; z.model[q] === tr ? 1 : 0), 0);\n    if (v > score) { score = v; best = i; }\n  });\n  return best;\n}\nconst $ = (id) => document.getElementById(id);\nconst NS = \&quot;http://www.w3.org/2000/svg\&quot;;\nconst R = 7, PAD = 26, SIZE = 420, U = (SIZE - 2 * PAD) / (2 * R);\nconst sx = (x) => PAD + (x + R) * U, sy = (y) => PAD + (R - y) * U;\n\nfunction el(tag, attrs = {}, parent) {\n  const e = document.createElementNS(NS, tag);\n  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);\n  if (parent) parent.appendChild(e);\n  return e;\n}\nconst fmt = (p) => `(${p.map((v) => Number.isInteger(v) ? v : v.toFixed(1)).join(\&quot;, \&quot;)})`;\nconst pct = (v) => `${Math.round(v * 100)}%`;\n\nfunction tabs() {\n  const t = $(\&quot;tabs\&quot;);\n  t.innerHTML = \&quot;\&quot;;\n  DATA.scenes.forEach((s, i) => {\n    const b = document.createElement(\&quot;button\&quot;);\n    b.textContent = `Scene ${i + 1}`;\n    b.setAttribute(\&quot;aria-pressed\&quot;, i === state.scene);\n    b.onclick = () => { state.scene = i; state.target = bestTarget(s); state.alpha = 4; $(\&quot;alpha\&quot;).value = 4; render(); };\n    t.appendChild(b);\n  });\n}\n\nfunction render() {\n  const sc = DATA.scenes[state.scene];\n  const tg = sc.targets[state.target];\n  const st = tg.steps[state.alpha];\n  const color = (n) => `var(${COLORS[sc.names.indexOf(n)]})`;\n  [...$(\&quot;tabs\&quot;).children].forEach((b, i) => b.setAttribute(\&quot;aria-pressed\&quot;, i === state.scene));\n  document.documentElement.style.setProperty(\&quot;--leaf\&quot;, color(sc.leaf));\n\n  // map\n  const svg = $(\&quot;map\&quot;);\n  svg.innerHTML = \&quot;\&quot;;\n  const g = el(\&quot;g\&quot;, {}, svg);\n  for (let v = -R; v <= R; v++) {\n    el(\&quot;line\&quot;, { x1: sx(v), x2: sx(v), y1: sy(-R), y2: sy(R), stroke: \&quot;var(--grid)\&quot;, \&quot;stroke-width\&quot;: v === 0 ? 1.5 : 1 }, g);\n    el(\&quot;line\&quot;, { y1: sy(v), y2: sy(v), x1: sx(-R), x2: sx(R), stroke: \&quot;var(--grid)\&quot;, \&quot;stroke-width\&quot;: v === 0 ? 1.5 : 1 }, g);\n  }\n  const lab = (x, y, txt, anchor = \&quot;middle\&quot;) => {\n    const t = el(\&quot;text\&quot;, { x, y, \&quot;text-anchor\&quot;: anchor, \&quot;font-size\&quot;: 13, fill: \&quot;var(--muted)\&quot;, \&quot;font-family\&quot;: \&quot;Inter, sans-serif\&quot; }, svg);\n    t.textContent = txt;\n  };\n  lab(SIZE / 2, 15, \&quot;N\&quot;); lab(SIZE - 10, SIZE / 2 + 4, \&quot;E\&quot;);\n  // where the moved object started\n  const [ox, oy] = sc.coords[sc.leaf];\n  el(\&quot;circle\&quot;, { cx: sx(ox), cy: sy(oy), r: 9, fill: \&quot;none\&quot;, stroke: color(sc.leaf), \&quot;stroke-width\&quot;: 1.5, \&quot;stroke-dasharray\&quot;: \&quot;3 3\&quot;, opacity: 0.8 }, svg);\n  // clickable targets\n  sc.targets.forEach((t, i) => {\n    const a = el(\&quot;g\&quot;, { class: \&quot;target\&quot;, tabindex: 0, role: \&quot;button\&quot;, \&quot;aria-label\&quot;: `Move ${sc.leaf} to ${fmt(t.pos)}` }, svg);\n    el(\&quot;circle\&quot;, { class: \&quot;hit\&quot;, cx: sx(t.pos[0]), cy: sy(t.pos[1]), r: 12, fill: \&quot;transparent\&quot; }, a);\n    el(\&quot;circle\&quot;, { cx: sx(t.pos[0]), cy: sy(t.pos[1]), r: i === state.target ? 6 : 4, fill: i === state.target ? \&quot;none\&quot; : color(sc.leaf),\n      stroke: color(sc.leaf), \&quot;stroke-width\&quot;: i === state.target ? 2 : 0, opacity: i === state.target ? 1 : 0.35 }, a);\n    const go = () => { state.target = i; render(); };\n    a.addEventListener(\&quot;click\&quot;, go);\n    a.addEventListener(\&quot;keydown\&quot;, (e) => { if (e.key === \&quot;Enter\&quot; || e.key === \&quot; \&quot;) { e.preventDefault(); go(); } });\n  });\n  // objects: true position (dot) and position read from activations (ring)\n  const posOf = (n) => n === sc.leaf ? st.pos : sc.coords[n];\n  sc.names.forEach((n) => {\n    const p = posOf(n);\n    // put the label below the dot when another object sits just above it\n    const below = sc.names.some((o) => o !== n &amp;&amp; Math.abs(posOf(o)[0] - p[0]) < 2.5 &amp;&amp; posOf(o)[1] > p[1] &amp;&amp; posOf(o)[1] - p[1] < 1.2);\n    const d = st.decoded[n];\n    if (state.rings &amp;&amp; n !== sc.root) {\n      const ring = el(\&quot;g\&quot;, { class: \&quot;mover\&quot;, transform: `translate(${sx(d[0])},${sy(d[1])})` }, svg);\n      el(\&quot;circle\&quot;, { r: 10, fill: \&quot;none\&quot;, stroke: color(n), \&quot;stroke-width\&quot;: 2 }, ring);\n    }\n    const dot = el(\&quot;g\&quot;, { class: \&quot;mover\&quot;, transform: `translate(${sx(p[0])},${sy(p[1])})` }, svg);\n    el(\&quot;circle\&quot;, { r: 8, fill: color(n), stroke: \&quot;var(--panel)\&quot;, \&quot;stroke-width\&quot;: 2 }, dot);\n    const t = el(\&quot;text\&quot;, { x: 12, y: below ? 22 : -10, \&quot;font-size\&quot;: 15, \&quot;font-weight\&quot;: 600, fill: \&quot;var(--text)\&quot;, \&quot;font-family\&quot;: \&quot;Inter, sans-serif\&quot;,\n      stroke: \&quot;var(--panel)\&quot;, \&quot;stroke-width\&quot;: 3, \&quot;paint-order\&quot;: \&quot;stroke\&quot; }, dot);\n    t.textContent = n;\n  });\n\n  // legend\n  $(\&quot;legend\&quot;).innerHTML =\n    `<span><svg width=\&quot;14\&quot; height=\&quot;14\&quot;><circle cx=\&quot;7\&quot; cy=\&quot;7\&quot; r=\&quot;5\&quot; fill=\&quot;var(--text-2)\&quot;/></svg>where it is</span>` +\n    (state.rings ? `<span><svg width=\&quot;16\&quot; height=\&quot;16\&quot;><circle cx=\&quot;8\&quot; cy=\&quot;8\&quot; r=\&quot;6\&quot; fill=\&quot;none\&quot; stroke=\&quot;var(--text-2)\&quot; stroke-width=\&quot;2\&quot;/></svg>w  two stated layouts. ` +\n        \&quot;Across 300 scenes this is the rule: the edit flips a switch between stated facts rather than sliding a point on a map.\&quot;\n      : \&quot;At this spot no question has an in-between answer; try another spot or another scene to see the snapping.\&quot;;\n  }\n\n  // answers\n  const rows = sc.questions.map((q, i) => {\n    const truth = st.truth[i], ans = st.model[i], clear = st.clear[i];\n    const conf = st.probs[i][ans];\n    const ok = ans === truth;\n    const right = clear ? (ok ? `<span class=\&quot;mark-ok\&quot; aria-label=\&quot;matches\&quot;>\u2713</span>` : `<span class=\&quot;mark-bad\&quot; aria-label=\&quot;does not match\&quot;>\u2717</span>`) : \&quot;\&quot;;\n    return `<tr><td class=\&quot;q\&quot;>${q.text}</td>` +\n      `<td>${clear ? `<span class=\&quot;ans\&quot;>${truth}</span>` : `<span class=\&quot;skip\&quot;>too close to call</span>`}</td>` +\n      `<td><span class=\&quot;ans\&quot;>${ans}</span> ${right} <span class=\&quot;conf\&quot;>${pct(conf)}</span></td></tr>`;\n  });\n  $(\&quot;answers\&quot;).innerHTML = rows.join(\&quot;\&quot;);\n  const n = st.clear.filter(Boolean).length;\n  const hit = st.model.filter((a, i) => st.clear[i] &amp;&amp; a === st.truth[i]).length;\n  $(\&quot;score\&quot;).innerHTML = `<b>${hit} of ${n}</b> answers match the layout with ${sc.leaf} at ${fmt(st.pos)}.`;\n}\n\nfunction init() {\n  const S = DATA.stats;\n  $(\&quot;stats\&quot;).innerHTML = `In a preregistered test on ${S.n_pairs} new scene pairs, a 2-number edit learned this way moves <b>${pct(S.das_acc)}</b> of the answers to the moved layout ` +\n    `(the answers the model gives when it actually reads the moved description; a random 2-number edit: ${pct(S.random_acc)}). Set halfway, only <b>${pct(S.halfway_novel)}</b> of answers that should change ` +\n    `to an in-between answer do so (chance ${pct(S.halfway_chance)}).`;\n  $(\&quot;alpha\&quot;).addEventListener(\&quot;input\&quot;, (e) => { sta
